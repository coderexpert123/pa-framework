# ============================================================================
# pa-framework — Root Worker & Dispatcher Configuration Template
# ============================================================================
# Copy this file to ~/.pa/config.yaml and customize worker commands for your OS.
#
# Skills Location:
# Skills are Markdown definitions stored in ~/.pa/skills/<skill-name>/skill.md
# (or $PA_HOME/skills/<skill-name>/skill.md). Run `pa list` to discover all skills.

# Worker-slot concurrency is capped by env vars, not this file: PA_MAX_CONCURRENT_WORKERS
# is the ceiling, and with dynamic slots on (default) the effective cap floats between
# it and PA_SLOTS_MIN, which is only reached when the machine is under pressure.
# See docs/CONFIGURATION.md "Resource tuning env vars".
# concurrency_limit (top-level key, absent by default) caps parallel skills in
# pa catchup; absent = follows the dynamic worker-slot cap above.
workers:
  # === claude (Priority 1 — Anthropic Claude Code CLI) ===
  - name: claude
    command: claude
    args:
      - "-p"
      - "--dangerously-skip-permissions"
      - "--output-format"
      - "stream-json"
      - "--input-format"
      - "stream-json"
      - "--verbose"
    input_mode: stdin-json
    output_format: stream-json
    check: claude --version
    rate_limit_patterns:
      - "rate limit"
      - "token limit"
      - "quota exceeded"
      - "Usage limit"
      - "hit your limit"
      - "429"
    priority: 1
    state_dir: "~/.claude/projects"
    state_pattern: "*.jsonl"
    tunables:
      model:
        args: ["--model", "{value}"]
        description: "Claude model name (sonnet, opus, haiku)."
      effort:
        args: ["--effort", "{value}"]
        values: [low, medium, high, max]
        description: "Reasoning effort level."

  # === codex (Priority 2 — OpenAI Codex CLI) ===
  - name: codex
    command: codex
    args:
      - "exec"
      - "--dangerously-bypass-approvals-and-sandbox"
      - "--color"
      - "never"
      - "--json"
      - "-"
    input_mode: stdin-text
    output_format: stream-json
    check: codex --version
    check_timeout: 15
    rate_limit_patterns:
      - "hit your usage limit"
      - "rate limit"
      - "quota exceeded"
      - "429"
    priority: 2
    state_dir: "~/.codex"
    state_pattern: "state_5.sqlite"
    tunables:
      model:
        args: ["--model", "{value}"]
        description: "OpenAI model name."
      effort:
        args: ["-c", "model_reasoning_effort={value}"]
        values: [minimal, low, medium, high]
        description: "Reasoning effort configuration."

  # === agy (Priority 3 — Antigravity CLI / Gemini 3.x Flash) ===
  # Antigravity CLI (agy) — setup-required; the dispatcher skips it if not installed.
  - name: agy
    command: agy
    args:
      - "--dangerously-skip-permissions"
      - "--print-timeout"
      - "65m"
      - "-p"
      - "{prompt}"
    input_mode: arg
    output_format: plain-text
    check: agy --version
    check_timeout: 10
    rate_limit_patterns:
      - "RESOURCE_EXHAUSTED"
      - "429"
    priority: 3
    # manual_only: true   # OPTIONAL: exclude this worker from automatic
    #                     # failover ordering — it runs ONLY when a dispatch
    #                     # explicitly names it (skill `worker:` frontmatter,
    #                     # bot /agent pick, or worker_pin).
    state_dir: "~/.gemini/antigravity-cli/conversations"
    state_pattern: "*.db"
    tunables:
      model:
        args: ["--model", "{value}"]
        values:
          - "gemini-3.8-flash-high"
          - "gemini-3.8-flash-medium"
          - "gemini-3.8-flash-low"
          - "gemini-3.7-flash-high"
          - "gemini-3.7-flash-medium"
          - "gemini-3.7-flash-low"
          - "claude-sonnet-4-6"
        description: "Model selection for Antigravity CLI."

  # === zclaude (Priority 4 — Extended Claude CLI Wrapper) ===
  # zclaude — example Claude-compatible wrapper CLI; setup-required.
  - name: zclaude
    command: zclaude
    args:
      - "-p"
      - "--dangerously-skip-permissions"
      - "--output-format"
      - "stream-json"
      - "--input-format"
      - "stream-json"
      - "--verbose"
    input_mode: stdin-json
    output_format: stream-json
    check: zclaude --version
    rate_limit_patterns:
      - "rate limit"
      - "token limit"
      - "quota exceeded"
      - "Usage limit"
      - "hit your limit"
      - "429"
    priority: 4
    state_dir: "~/.claude/projects"
    state_pattern: "*.jsonl"
    tunables:
      model:
        args: ["--model", "{value}"]
        description: "Claude model name (sonnet, opus, haiku)."
      effort:
        args: ["--effort", "{value}"]
        values: [low, medium, high, max]
        description: "Reasoning effort level."

  # === devin (Priority 5 — Devin CLI / Codeium cloud) ===
  # devin — setup-required; the dispatcher skips it if not installed.
  # Requires: devin.cmd shim on PATH (wraps %LOCALAPPDATA%\devin\cli\bin\devin.exe)
  # Auth: %APPDATA%\devin\credentials.toml must have a valid windsurf_api_key.
  # Workspace trust: --respect-workspace-trust false required for non-interactive.
  - name: devin
    secret_allowlist:
      [
        BRIEF_STATEMENT_EXAMPLE_SENDER,
        BRIEF_STATEMENT_EXAMPLE_SUBJECT,
        BRIEF_STATEMENT_PROVIDER,
        BRIEF_STATEMENT_SENDER_NAMES,
        COROS_EMAIL,
        COROS_PASSWORD,
        CREDIT_CARD_PASSWORDS,
        GEMINI_OAUTH_CLIENT_ID,
        GEMINI_OAUTH_CLIENT_SECRET,
        GOOGLE_AUTH_REDIRECT_URI,
        GROQ_API_KEY,
        OBSIDIAN_BRIEFS_DIR,
        PA_ALERTS_CHAT_ID,
        PA_ALERTS_THREAD_ID,
        PA_BACKUP_PASSPHRASE,
        PA_PLANS_DRIVE_FOLDER_ID,
        PA_USER_NAME,
        PORTFOLIO_CONTEXT_OWNER,
        STRAVA_CLIENT_ID,
        STRAVA_CLIENT_SECRET,
        STRAVA_REFRESH_TOKEN,
        TELEGRAM_BOT_TOKEN,
        TELEGRAM_BRIEFING_CHAT_ID,
        TELEGRAM_CHAT_ID,
        TELEGRAM_DAILY_BRIEFING_THREAD_ID,
      ]
    command: devin
    args:
      - "--permission-mode"
      - "dangerous"
      - "--respect-workspace-trust"
      - "false"
      - "--prompt-file"
      - "{prompt_file}"
      - "-p"
    input_mode: arg
    output_format: plain-text
    check: devin version
    check_timeout: 15
    rate_limit_patterns:
      - "rate limit"
      - "quota exceeded"
      - "429"
      - "usage limit"
      - "out of credits"
      - "insufficient balance"
    priority: 5
    state_dir: "~/AppData/Roaming/devin/cli"
    state_pattern: "*.json"
    tunables:
      model:
        args: ["--model", "{value}"]
        description: "Devin model (e.g. adaptive, claude-sonnet-4, claude-opus-4.6)."

  # === opencode (Priority 9 — opencode headless `run`, manual-only until proven) ===
  # setup-required; the dispatcher skips it when `opencode --version` fails.
  # Headless shape `opencode run [message..]` (no `exec` subcommand; verified
  # --help 2026-09-17). output_format plain-text: opencode's `--format json`
  # event envelope has no worker-exec dialect entry and worker-exec.ts is out
  # of scope for this wave, so structured parsing is deferred to a follow-up.
  # rate_limit_patterns intentionally EMPTY: patterns must be phrases seen in
  # real errors (pa/src/workers.ts isRateLimited already scans output+error
  # for any worker not named codex/agy/devin — no code change needed).
  - name: opencode
    command: opencode
    args:
      - "run"
      - "{prompt}"
    input_mode: arg
    output_format: plain-text
    check: opencode --version
    check_timeout: 15
    rate_limit_patterns: []
    priority: 9
    manual_only: true
    state_dir: "~/.local/share/opencode"
    state_pattern: "opencode.db"
    tunables:
      model:
        args: ["--model", "{value}"]
        description: "Model in provider/model format (opencode default when omitted)."

# === Stuck Agent Evaluator ===
evaluator:
  worker: claude
  timeout: 60

# === Background Maintenance Jobs ===
maintenance:
  session-gc: { enabled: true, every: 6h }
  archive-prune: { enabled: true, every: 1h }
  # A maintenance override may only disable a job (enabled: false) or change its cadence (every).
  nonpaged-pool-watch: { enabled: true, every: 15m }

# === usage (optional) ===
# Track token usage and set budget alerts. The `pa costs` command reports
# usage rollups by worker, model, and skill. The budget_monthly_usd field is
# parsed but budget alerting is not implemented yet — reserved for future budget alerts.
# usage:
#   budget_monthly_usd: 100   # optional monthly USD budget; alerting not implemented yet

# === Model Pricing (per-million-token USD) ===
# Optional price overrides for `pa costs` dollar estimates. All keys are worker or model names.
# Worker-level fallbacks (agy, zclaude) price records that carry no model field.
# Input/output/cache_read are per million tokens. Thinking bills at output rate.
# Cache_read defaults to 0 when omitted. Values are list prices verified 2026-08-27 (gemini-3.8 verified 2026-09-04).
# model_pricing:
#   agy:                    { input: 0.75, output: 3.75, cache_read: 0.075 }  # = gemini-3.8-flash
#   zclaude:                { input: 1.40, output: 4.40, cache_read: 0.26 }   # = glm-5.3
#   claude-opus-4-6:        { input: 5,    output: 25,   cache_read: 0.50 }
#   claude-sonnet-4-6:      { input: 3,    output: 15,   cache_read: 0.30 }
#   claude-sonnet-5:        { input: 2,    output: 10,   cache_read: 0.20 }
#   claude-haiku-4-5:       { input: 1,    output: 5,    cache_read: 0.10 }
#   gemini-3.8-flash:       { input: 0.75, output: 3.75, cache_read: 0.075 }
#   gemini-3.7-flash:       { input: 0.75, output: 3.75, cache_read: 0.075 }
#   gemini-3.6-flash:       { input: 0.75, output: 3.75, cache_read: 0.075 }
#   gemini-3.5-flash:       { input: 1.50, output: 9.00, cache_read: 0.15 }
#   gemini-3.5-flash-lite:  { input: 0.30, output: 2.50, cache_read: 0.03 }
#   gemini-2.5-flash:       { input: 0.30, output: 2.50, cache_read: 0.03 }
#   gemini-2.5-flash-lite:  { input: 0.10, output: 0.40, cache_read: 0.01 }
#   glm-5.3:                { input: 1.40, output: 4.40, cache_read: 0.26 }
#   glm-5.2:                { input: 1.40, output: 4.40, cache_read: 0.26 }
#   glm-5.1:                { input: 1.40, output: 4.40, cache_read: 0.26 }
#   glm-5:                  { input: 1.00, output: 3.20, cache_read: 0.20 }
#   glm-4.7:                { input: 0.60, output: 2.20, cache_read: 0.11 }

# === git workflow (persona switch) ===
# pa ships run-only by default: no skill commits, pushes, or reverts on your
# behalf. Flip to true (inside a git work tree) to enable snapshot commits and
# the self-improver example's code-fix lane. Probe: pa git-guard
git_workflow:
  enabled: false

# === Voice Message Transcription ===
transcription:
  engine_preference: auto
  worker_mode: spawn
  cloud_order: [groq, openai, deepgram]
  language: null

# === Voice inbox app (projects/voice-inbox) ===
# Optional block. Omit it and only the voice-inbox app is unconfigured. The
# app server refuses to start until inbox_topic names the topic that receives
# new tasks. Env overrides: VOICE_INBOX_PORT, VOICE_INBOX_INBOX_TOPIC,
# VOICE_INBOX_MIN_AUDIO_BYTES.
# voice_inbox:
#   inbox_topic: "CHATID_THREADID"  # REQUIRED "<chatId>_<threadId>" topic key
#   port: 8787                      # binds 127.0.0.1 only
#   max_upload_mb: 25
#   session_ttl_hours: 168          # pairing session lifetime (7 days)
#   pairing_ttl_minutes: 10         # one-time pairing-code lifetime
#   min_audio_bytes: 8192           # AI-223: uploads under this are rejected (400) at POST /tasks
#   default_topic: "CHATID_THREADID" # optional; default topic for unmatched requests (default: inbox chat thread 0)

# === Voice-inbox deterministic fallback (pa host job "voice-inbox-fallback") ===
# Optional. The job's numeric thresholds are env vars — see .env.example section 9 —
# this is the one structured knob: a transcript keyword -> topic map, checked before
# falling back to the inbox chat's general-knowledge topic. Empty (the default) always
# falls through.
# voice_inbox_fallback:
#   keyword_topics: {}
#   # keyword_topics:
#   #   invoice: "CHATID_THREADID"   # lowercase substring match, first match wins

# === Voice-inbox typed routing (pa + telegram bot; needs TYPESAFE_API_KEY) ===
# Optional; off unless enabled: true. The bot places a received task by two
# TypeSafe Choices (destination topic, open-conversation continuation) and
# hands low-confidence ones to the inbox routing turn; the fallback job uses
# the same judgment as its last resort. Pick thresholds with `pa typesafe eval`.
# voice_inbox_routing:
#   enabled: true
#   act_confidence: 0.9          # destination confidence needed to place
#   continue_confidence: 0.9     # confidence needed to join an open conversation
#   no_match: create-topic       # create-topic | default-topic | escalate
#   escalation: llm-turn         # llm-turn | place

# === Topic routing (optional) ===
# support: the FALLBACK topic receiving land-or-discard triage for dirty
# working-tree paths the daily-recon sweep cannot attribute to an owner.
# Format "<chatId>_<threadId>", e.g. "310_5".
#
# Before falling back to `support`, resolution consults the optional
# topic-ownership registry at ~/.pa/topic-ownership-registry.json — a JSON
# object keyed "<chatId>_<threadId>"; each row may list repo-relative `owned`
# path prefixes (segment-matched: the prefix itself or anything under it), and
# at most one row may carry role: "catch-all". Resolution order everywhere:
# registry catch-all row -> this `support` knob -> unset. A missing or corrupt
# registry degrades to the `support` fallback (fail-to-empty). With neither
# set: unattributed paths are counted in daily-recon.json's unknown_n (and
# surfaced by the weekly ops digest) but no task is filed.
topics:
  support: "310_5"

# === Routing policy (optional; off unless enabled: true) ===
# Per-turn worker routing for the Telegram bot: each turn is classified
# code/engineering vs general by deterministic regex signals, and code turns
# override the topic default with a time-window worker. The peak window is
# cost_tier.peak_window_utc above (the SAME window off_peak skills defer on) —
# it is never configured twice.
#
# Onboarding: set the three workers to your own setup's names — which agent
# should answer quick/general asks, which should take engineering work off-peak,
# and which (usually a non-peak-quota agent) should take engineering work while
# your code-plan provider bills peak rates. Omit the block entirely for the
# stock behavior (topic default, else priority-ordered failover).
#
# routing_policy:
#   enabled: true
#   judge: agy                 # agy (fast LLM judge) | typesafe (TypeSafe API; needs TYPESAFE_API_KEY) | deterministic (regex only)
#   judge_model: gemini-3.6-flash-low  # model for agy judge
#   judge_timeout_ms: 20000    # timeout before failing open to regex (ms)
#   judge_command: agy         # optional custom command/path to agy
#   general_worker: agy        # general turns on topics with no topic_defaults entry
#   code_worker: zclaude       # code-classified turns outside the peak window
#   peak_code_worker: claude   # code-classified turns inside the peak window
#   code_patterns: []          # extra regex sources appended to the built-ins
#   topic_classes:             # per-topic pin: code | general | off
#     "123_456": code

# === Capability provision (pa init --provision, 2026-09-18) ===
# `pa init --provision` generates a workers: block for the CLIs/kinds you
# accept (written to ~/.pa/config.yaml.provisioned for review before merging
# here) and always keeps a local delivery floor: notifications also land as
# files under ~/.pa/outbox/ even with no Telegram configured. The generated
# block carries PATH-resolved commands and env-var NAMES only — never a key
# value or an absolute machine path. See docs/CONFIGURATION.md
# "Capability provision (pa init --provision)".

# === Model router (2026-09-18; commented out = zero behavior) ===
# Optional per-turn router beside the judge ladder. Block ABSENT = disabled,
# zero logging. Block present (even enabled: false) = SHADOW mode: the router
# computes what it would have chosen and logs a shadow line to
# ~/.pa/model-router-shadow.jsonl; the existing routing ladder still decides.
# enabled: true additionally lets the router DECIDE. Pins outrank only while
# deprecate_pins is explicitly false (below); the default retires them for
# TURN DISPATCH on router-decided turns (command handlers keep parsing and
# replying, and landed pins keep working as stickiness incumbents).
#model_router:
#  enabled: false               # true = router decides (stage-2 flip); false/absent = shadow-only
#  judge: typesafe              # only supported value this wave
#  state_max_chars: 4000        # max classified-source text fed to the classifier
#  context_max_chars: 2000      # max prior-turn digest chars
#  topic_max_chars: 300         # max topic name+description chars
#  zai_workers:                 # workers billed on the shared z.ai quota — moved to the
#    - zclaude                  #   END of the candidate order inside the peak window
#  sticky: true                 # conversation stickiness (default ON): keep the incumbent
#                              #   worker while the turn's needs stay inside its envelope;
#                              #   escapes are capability-UP / unavailable / peak-zai-last only
#  table:                       # policy table — config ORDER IS THE RANK; first satisfying row wins.
#    - worker: agy              #   "cheapest" = rank order, never a price number.
#      max_tier: quick_lookup   #   one of quick_lookup | standard | deep_reasoning | rich_toolchain
#      max_score: 1             #   highest effort score (1-5) this row can express
#    - worker: codex
#      model: gpt-5-codex       # optional; omitted = the worker's configured default model
#      max_tier: rich_toolchain
#      max_score: 5
#  effort_projection:           # per-worker effort-score -> native effort-knob value
#    codex:
#      tunable: effort          # effort | none (none = knobless worker, explicit recategorize)
#      map: { 1: minimal, 2: low, 3: medium, 4: medium, 5: high }
#    devin:
#      tunable: none
#  shadow_path: <absolute path>  # omit for the default ~/.pa/model-router-shadow.jsonl; a RELATIVE value resolves against the process CWD, not ~/.pa
#  deprecate_pins: true         # default ON when the block exists; explicit false = today's pin behavior.
#                              #   Under it /agent,/model,/effort,/default and worker_pin stop steering
#                              #   DISPATCH on router-decided turns; commands still parse+reply, and
#                              #   landed pins keep working as stickiness incumbents.
#  availability_ttl_ms: 5000   # availability-cache TTL in ms (0 disables = always fresh);
#                              #   env PA_MODEL_ROUTER_AVAILABILITY_TTL_MS overrides
#  placement:                  # placement-candidate caps (reader + prompt section)
#    candidate_cap: 25         # candidates kept, most-recently-updated first (current conversation exempt)
#    goal_chars: 80            # per-candidate goal cap in the prompt section
#    section_chars: 2400       # whole-candidates-section cap; candidates dropped tail-first
#  surfaces:                   # per-surface staging; an absent key = shadow (dark — recorded, not applied)
#    fallback: shadow          # flip 1 — the failover ladder consumes the router's probability chain
#    steer: shadow             # flip 2 — the router's steer/wait decision corrects an in-flight run
#    placement: shadow         # flip 3 — placement replaces the orchestrator-persona branch (flip LAST)
