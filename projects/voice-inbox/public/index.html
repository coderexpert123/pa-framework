  <meta name="theme-color" content="#fbfcfd" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Voice Inbox">
  <title>Voice Inbox</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <script src="answer-shapes.js" defer></script>
  <script src="live-pane.js" defer></script>
  <script src="app.js" defer></script>
</head>
