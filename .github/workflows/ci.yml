name: CI

on:
  # ci.yml is tracked in BOTH repos this project shares a working tree with
  # (see CLAUDE.md's Public CI section). Both now use `main` as their default
  # branch (unified 2026-07-22 -- the private deployment repo was previously
  # on `master`, which is why this trigger silently never ran there at all
  # despite Actions being enabled and the workflow file present).
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Computes which parts of the tree changed so the heavy jobs below can
  # skip themselves on docs/plans-only changes. Deliberately conservative:
  # `pa/scripts/**` (Python) is a SUBSET of `pa/**`, so a Python-only change
  # still marks `pa=true` and re-runs the Node suite too -- that's an
  # intentional over-trigger, not a bug; the one thing this must never do is
  # under-trigger. `workflow=true` forces every job below to run whenever
  # ci.yml itself changes, so a change to the skip logic is always validated
  # in full. Branch-protection required checks are matched by job/check
  # NAME (e.g. "Build + test (windows-latest)"), which comes from `name:` +
  # the matrix values below and is unaffected by adding `if:` conditions --
  # do not rename `test`/`test-python` or change their matrix values
  # without also updating pa-framework's required-status-checks list, or
  # PRs will block forever on a check that never gets reported. A skipped
  # required check is treated as passing by GitHub branch protection, which
  # is the mechanism this whole skip depends on.
  changes:
    name: Detect affected paths
    runs-on: ubuntu-latest
    outputs:
      pa: ${{ steps.filter.outputs.pa }}
      bot: ${{ steps.filter.outputs.bot }}
      python: ${{ steps.filter.outputs.python }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            pa:
              - 'pa/**'
            bot:
              - 'projects/telegram-bot/**'
            python:
              - 'pa/scripts/**'
            workflow:
              - '.github/workflows/ci.yml'

  test:
    name: Build + test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.pa == 'true' || needs.changes.outputs.bot == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: |
            pa/package-lock.json
            projects/telegram-bot/package-lock.json

      # Order is load-bearing — do not parallelize into separate jobs: the
      # bot imports pa's compiled dist/ output directly (relative imports
      # like ../../../pa/dist/src/...) AND resolves its own dependencies
      # from pa/node_modules at runtime (no separate install for pa's deps
      # in the bot's own node_modules). pa must be installed + built before
      # the bot's install/build/test step runs.
      - name: Build and test pa orchestrator
        working-directory: pa
        run: |
          npm ci
          npm run build
          npm test

      - name: Build and test Telegram bot
        working-directory: projects/telegram-bot
        run: |
          npm ci
          npm run build
          npm test

  # Split out of the `test` job on 2026-08-04. Unlike the Node steps above,
  # this suite has NO dependency on pa or the bot being installed/built
  # (verified: no test_*.py references pa/dist, node_modules, or shells out
  # to npm) — it was only ever sequential because it was easiest to write
  # that way when it was added 2026-07-23. As its own matrix job it runs
  # CONCURRENTLY with `test` instead of after it, cutting real wall-clock
  # with no added risk. Do not merge it back into `test` "for simplicity" —
  # that reintroduces the exact wait this split removes.
  test-python:
    name: Python tests (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.python == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      # 2026-07-23: before this job existed, the Node-only CI job (the one
      # required by branch protection) never ran the Python suite at all --
      # pre-push-pii-guard, pii_ci_scan.py, and friends only ever got tested
      # by someone remembering to run them by hand. Runs across all 3
      # platforms deliberately: the guard's own tests exercise both the
      # win32 (.cmd shim) and POSIX (chmod/killpg) code paths.
      # verify_pii_guard_agy_e2e.py is deliberately NOT run here -- it needs
      # a real agy binary that doesn't exist on these runners and is a
      # manual/on-demand harness by design.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # No pa/requirements.txt exists -- these two are the only non-stdlib
      # imports across all 5 test_*.py files (test_backup_secrets.py needs
      # cryptography; test_finish_google_telegram_reauth.py needs
      # google-auth-oauthlib), installed explicitly rather than narrowing
      # which tests run.
      - name: Install Python test dependencies
        run: pip install cryptography google-auth-oauthlib

      - name: Run Python test suite (PII guard + related tooling)
        run: python -m unittest discover -s pa/scripts/tests -p "test_*.py"
        env:
          PYTHONIOENCODING: utf-8
