# Dependabot configuration for Personal Assistant
# Monthly updates: groups minor+patch together, majors separate, no automerge
version: 2
updates:

  # Node.js dependencies for pa/ CLI tool
  - package-ecosystem: "npm"
    directory: "/pa"
    schedule:
      interval: "monthly"
    groups:
      minor-and-patch:
        patterns:
          - "patch"
          - "minor"
    ignore:
      - dependency-name: "*"
        update-types: ["major"]
    open-pull-requests-limit: 10

  # Node.js dependencies for Telegram bot
  - package-ecosystem: "npm"
    directory: "/projects/telegram-bot"
    schedule:
      interval: "monthly"
    groups:
      minor-and-patch:
        patterns:
          - "patch"
          - "minor"
    ignore:
      - dependency-name: "*"
        update-types: ["major"]
    open-pull-requests-limit: 10

  # Python dependencies for pa/scripts/
  - package-ecosystem: "pip"
    directory: "/pa/scripts"
    schedule:
      interval: "monthly"
    groups:
      minor-and-patch:
        patterns:
          - "patch"
          - "minor"
    ignore:
      - dependency-name: "*"
        update-types: ["major"]
    open-pull-requests-limit: 10

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      minor-and-patch:
        patterns:
          - "patch"
          - "minor"
    ignore:
      - dependency-name: "*"
        update-types: ["major"]
    open-pull-requests-limit: 10

  # Major version updates (separate PRs)
  # npm major for pa/
  - package-ecosystem: "npm"
    directory: "/pa"
    schedule:
      interval: "monthly"
    ignore:
      - dependency-name: "*"
        update-types: ["patch", "minor"]
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "major-update"

  # npm major for Telegram bot
  - package-ecosystem: "npm"
    directory: "/projects/telegram-bot"
    schedule:
      interval: "monthly"
    ignore:
      - dependency-name: "*"
        update-types: ["patch", "minor"]
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "major-update"

  # pip major for pa/scripts/
  - package-ecosystem: "pip"
    directory: "/pa/scripts"
    schedule:
      interval: "monthly"
    ignore:
      - dependency-name: "*"
        update-types: ["patch", "minor"]
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "major-update"

  # GitHub Actions major
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    ignore:
      - dependency-name: "*"
        update-types: ["patch", "minor"]
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "major-update"
